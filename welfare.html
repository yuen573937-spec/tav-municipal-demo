<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>福祉訪問・支援ギャップ発見AI | TAV × Treasure Data デモ</title><style>
:root{--navy:#10244b;--blue:#2168e8;--green:#009d78;--purple:#6845ca;--bg:#f3f6fc;--line:#dce5f2;--text:#1c2e4e;--muted:#667792}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif}header{background:linear-gradient(100deg,#0b3474,#2168e8 65%,#6048c8);color:white;padding:18px 30px;display:flex;align-items:center;justify-content:space-between;gap:12px}header h1{font-size:21px;margin:0}header small{display:block;opacity:.8;margin-top:5px}button,select,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbd8ec;border-radius:9px;background:white;padding:9px 13px;color:#173866}button:hover{background:#eaf2ff}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button.green{background:var(--green);color:white;border-color:var(--green)}button.danger{color:#a52e46}button:disabled{opacity:.45;cursor:default}.shell{display:flex;min-height:calc(100vh - 76px)}nav{width:224px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:18px 12px}nav button{display:block;width:100%;text-align:left;border:0;margin-bottom:7px;padding:13px}nav button.active{background:#eaf2ff;color:#1554ba;font-weight:800;border-left:4px solid #2168e8}.main{padding:24px;max-width:1550px;width:100%;margin:auto}.title{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:17px}.title h2{margin:0;font-size:24px}.sub{color:var(--muted);font-size:13px;margin:5px 0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card,.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:19px;box-shadow:0 3px 15px #233e7410}.card strong{font-size:29px;display:block;margin-top:6px;color:var(--navy)}.card small{color:var(--muted)}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:17px}.panel h3{margin:0 0 15px;font-size:17px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar input,.toolbar select,select,input[type=date],textarea{border:1px solid #cbd8ec;border-radius:8px;padding:9px;background:white;color:var(--text)}table{border-collapse:collapse;width:100%;font-size:13px}th{background:#edf3ff;text-align:left;color:#334c77}td,th{border-bottom:1px solid #e4eaf4;padding:11px 9px;vertical-align:top}tr.clickable{cursor:pointer}tr.clickable:hover{background:#f3f7ff}.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:12px;background:#e8f0ff;color:#2458aa}.badge.warn{background:#fff0dc;color:#ac6410}.badge.red{background:#ffebed;color:#bb3450}.badge.ok{background:#e3f7ef;color:#168260}.quote{background:#eff6ff;border-left:4px solid var(--blue);padding:15px;border-radius:9px;line-height:1.8}.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.section{margin-bottom:16px}.section h4{margin:0 0 8px}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:15px}.list-item{padding:12px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}.list-item:hover,.list-item.sel{background:#eaf2ff}.list-item b{display:block}.list-item small{color:var(--muted)}.action{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px}.action span{font-size:13px}.bar{height:12px;border-radius:9px;background:#e8eef8;overflow:hidden}.bar>div{height:100%;background:#ef6b91}.chartrow{display:grid;grid-template-columns:90px 1fr 46px;gap:10px;align-items:center;margin:13px 0;font-size:13px}.notice{border-radius:9px;background:#fff8e7;border:1px solid #f3dfb5;padding:11px;font-size:12px;line-height:1.6}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.step{border-radius:10px;background:#eff5ff;padding:16px;line-height:1.7}.step b{color:#1258b8}.hidden{display:none}.footer{color:#667792;font-size:12px;margin-top:18px}.small{font-size:12px}.right{text-align:right}@media(max-width:950px){.cards{grid-template-columns:repeat(2,1fr)}.grid,.layout{grid-template-columns:1fr}nav{width:75px}nav button{font-size:0}nav button::first-letter{font-size:19px}.main{padding:14px}}@media(max-width:550px){.cards{grid-template-columns:1fr 1fr;gap:7px}.card,.panel{padding:12px}.card strong{font-size:23px}header{padding:13px}.steps{grid-template-columns:1fr}table{font-size:11px}td,th{padding:7px 4px}}
</style></head><body><header><div><h1>🏠 福祉訪問｜支援の取りこぼし発見AI</h1><small>TAV デバイス × 訪問記録 × Treasure Data（架空データの操作デモ）</small></div><span class="badge">DEMO / 実データ未接続</span></header><div class="shell"><nav><button data-page="overview" class="active">🏠 全体概要</button><button data-page="visits">🎙 訪問記録・TAV</button><button data-page="cases">🧩 支援ギャップ確認</button><button data-page="actions">✅ フォロー管理</button><button data-page="dashboard">📊 TD地域分析</button><button data-page="guide">ℹ️ 操作ガイド</button></nav><main class="main" id="content"></main></div><script>
const BASE=[
{id:'F-001',name:'鈴木 花子',age:78,area:'A地区',date:'2026-10-21',staff:'山田',issue:'通院',quote:'最近、病院まで行くのが大変で、バスの本数も少なくて……',support:'未確認',wish:'確認待ち',status:'要確認',action:'移動支援サービスの利用条件を確認',due:'2026-11-04',notes:'週2回の通院。家族の送迎は難しい。',consent:true},
{id:'F-002',name:'佐藤 正雄',age:83,area:'B地区',date:'2026-10-20',staff:'田中',issue:'買い物',quote:'重い荷物を持って帰るのがつらくて、最近は買い物に行く回数が減った。',support:'未利用',wish:'利用希望',status:'対応予定',action:'買い物支援サービスを案内',due:'2026-11-02',notes:'スーパーまで徒歩20分。',consent:true},
{id:'F-003',name:'高橋 美代子',age:81,area:'C地区',date:'2026-10-19',staff:'山田',issue:'孤立',quote:'この頃、誰かと話すことが少なくなってね。',support:'不明',wish:'確認待ち',status:'次回訪問',action:'地域サロンへの参加希望を確認',due:'2026-11-12',notes:'外出機会が減少。',consent:true},
{id:'F-004',name:'小林 和夫',age:76,area:'A地区',date:'2026-10-18',staff:'佐々木',issue:'買い物',quote:'買い物は大変だけど、今のところ娘が手伝ってくれています。',support:'家族支援あり',wish:'利用希望なし',status:'対応不要',action:'本人の意向を記録し次回再確認',due:'',notes:'本人は公的サービスを希望していない。',consent:true},
{id:'F-005',name:'田村 京子',age:88,area:'B地区',date:'2026-10-17',staff:'田中',issue:'通院',quote:'病院へ行くときにタクシー代が高くて困る。',support:'利用中',wish:'利用希望',status:'支援接続済',action:'利用状況を継続確認',due:'',notes:'移動支援の利用開始を確認。',consent:true},
{id:'F-006',name:'伊藤 修一',age:79,area:'D地区',date:'2026-10-16',staff:'佐々木',issue:'外出',quote:'足腰が弱くなって、散歩に出る機会が減った。',support:'未確認',wish:'確認待ち',status:'確認中',action:'介護予防教室の案内可否を確認',due:'2026-11-07',notes:'転倒歴の有無は未確認。',consent:true},
{id:'F-007',name:'中村 幸子',age:74,area:'C地区',date:'2026-10-15',staff:'山田',issue:'買い物',quote:'食材を買いに出るのが難しい日があります。',support:'未利用',wish:'利用希望',status:'支援接続済',action:'宅配支援の利用開始を確認',due:'',notes:'本人の同意を得て紹介済み。',consent:true},
{id:'F-008',name:'加藤 博',age:85,area:'D地区',date:'2026-10-14',staff:'田中',issue:'孤立',quote:'近所の友達が引っ越してから、話し相手が減った。',support:'未確認',wish:'確認待ち',status:'要確認',action:'地域活動への関心を確認',due:'2026-11-10',notes:'本人の希望は未確認。',consent:true}
];
let cases=JSON.parse(localStorage.getItem('welfare_cases_v2')||'null')||structuredClone(BASE),selected=cases[0].id,filterArea='すべて',filterStatus='すべて',filterIssue='すべて',page='overview';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('welfare_cases_v2',JSON.stringify(cases))}function badge(s){let c=/接続済|対応不要/.test(s)?'ok':/要確認|未利用|未確認/.test(s)?'red':'warn';return `<span class="badge ${c}">${esc(s)}</span>`}function stats(a=cases){let open=a.filter(x=>!['支援接続済','対応不要'].includes(x.status));return {total:a.length,done:a.filter(x=>x.status==='支援接続済').length,open:open.length,follow:a.filter(x=>x.status==='対応予定'||x.status==='確認中'||x.status==='次回訪問').length}}function opts(arr,v){return arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}function go(p){page=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));function head(title,sub,tools=''){return `<div class="title"><div><h2>${title}</h2><p class="sub">${sub}</p></div><div class="row">${tools}</div></div>`}function tiles(a=cases){let s=stats(a);return `<div class="cards"><div class="card"><small>訪問記録</small><strong>${s.total}件</strong></div><div class="card"><small>支援接続済</small><strong style="color:#009d78">${s.done}件</strong></div><div class="card"><small>未確認・未対応候補</small><strong style="color:#d04b6b">${s.open}件</strong></div><div class="card"><small>フォロー進行中</small><strong>${s.follow}件</strong></div></div>`}function overview(){return head('福祉訪問から、支援につながるまで','会話の記録だけで終わらせず、本人の希望・支援利用状況・次の対応をつなぐ。',`<button class="primary" onclick="go('visits')">訪問記録を操作 →</button>`)+tiles()+`<div class="steps"><div class="step"><b>① TAVデバイスで会話を記録</b><br>訪問職員が本人に説明し同意を得て記録。音声から生活課題候補を抽出。</div><div class="step"><b>② 支援ギャップを確認</b><br>既存の利用状況と照合。未利用＝支援不足と決めつけず、本人の希望を確認。</div><div class="step"><b>③ TDで地域別に集計</b><br>確認・未対応が集中する地域と課題を把握し、訪問計画や制度案内を改善。</div></div><div class="grid" style="margin-top:18px"><div class="panel"><h3>最近の訪問ケース</h3>${caseTable(cases.slice(0,5),true)}</div><div class="panel"><h3>デモで試せる操作</h3><p>訪問ケースを切り替える／会話の抽出結果を見る／支援状況と本人意向を変更する／フォローを完了する／地域分析を絞り込む／CSVを出力する。</p><div class="notice">※ 登場人物・会話・支援状況・件数はすべて架空。TAVによる音声認識やTreasure Dataへの接続は実装していません。実際の行政データにはアクセスしません。</div></div></div>`}function caseTable(a,click=false){return `<div style="overflow-x:auto"><table><thead><tr><th>ケース</th><th>地域</th><th>課題</th><th>支援状況</th><th>対応状況</th></tr></thead><tbody>${a.map(x=>`<tr class="${click?'clickable':''}" ${click?`onclick="selected='${x.id}';go('cases')"`:''}><td><b>${esc(x.name)}</b><br><span class="small muted">${x.id}</span></td><td>${esc(x.area)}</td><td>${esc(x.issue)}</td><td>${esc(x.support)}</td><td>${badge(x.status)}</td></tr>`).join('')}</tbody></table></div>`}function visits(){let x=cases.find(x=>x.id===selected)||cases[0];return head('TAV 訪問記録・会話抽出','実際のマイク録音ではなく、架空の会話を使った画面操作のシミュレーション。',`<button onclick="simulate()">🎙 会話抽出を再現</button><button class="primary" onclick="go('cases')">支援ギャップ確認へ →</button>`)+`<div class="layout"><div class="panel"><h3>訪問ケース一覧</h3>${cases.map(c=>`<div class="list-item ${c.id===selected?'sel':''}" onclick="selected='${c.id}';render()"><b>${esc(c.name)}（${c.age}歳）</b><small>${c.id} ｜ ${c.area} ｜ ${c.issue}</small></div>`).join('')}</div><div class="panel"><h3>訪問記録｜${esc(x.name)}さん</h3><p class="sub">${x.date}　担当：${x.staff}　音声取得：本人同意あり（想定）</p><div class="section"><h4>💬 訪問時の発言（サンプル）</h4><div class="quote">「${esc(x.quote)}」</div></div><div class="section"><h4>🧠 TAVが抽出する生活課題（デモ）</h4><div id="extract"><span class="badge">${esc(x.issue)}</span>　${esc(x.notes)}<br><span class="muted small">職員による確認・修正が必要です。</span></div></div><div class="section"><h4>🏷 ケース情報</h4><p>地域：${x.area}　支援利用：${esc(x.support)}　本人意向：${esc(x.wish)}</p></div><div class="notice">本デモでは音声収録・音声送信を行いません。実運用では録音の目的、同意、保存期間、アクセス権限の設計が必要です。</div></div></div>`}function simulate(){let el=$('#extract');if(!el)return;el.innerHTML='<span class="badge warn">会話を解析中…（演出）</span>';setTimeout(()=>{let x=cases.find(x=>x.id===selected);if(el&&page==='visits')el.innerHTML=`<span class="badge ok">抽出完了（サンプル）</span><p><b>生活課題：</b>${esc(x.issue)}<br><b>会話要約：</b>${esc(x.quote)}<br><b>確認候補：</b>${esc(x.action)}</p><span class="small muted">※ 実際のAI推論ではなく、事前設定されたサンプル表示です。</span>`},650)}function detail(){let x=cases.find(x=>x.id===selected)||cases[0];return `<div class="panel"><div class="title"><h3>支援ギャップ確認｜${esc(x.name)}さん（${x.age}歳）</h3>${badge(x.status)}</div><p class="sub">${x.id} ｜ ${x.area} ｜ 訪問日 ${x.date} ｜ 担当 ${x.staff}</p><div class="quote">「${esc(x.quote)}」</div><div class="section" style="margin-top:15px"><h4>会話から把握した生活課題</h4><span class="badge">${esc(x.issue)}</span>　${esc(x.notes)}</div><div class="grid"><label>現在の支援利用状況<br><select id="support" style="width:100%;margin-top:6px">${opts(['未確認','未利用','不明','利用中','家族支援あり'],x.support)}</select></label><label>本人の利用希望<br><select id="wish" style="width:100%;margin-top:6px">${opts(['確認待ち','利用希望','利用希望なし'],x.wish)}</select></label></div><div class="section" style="margin-top:17px"><h4>次の対応</h4><textarea id="next" rows="2" style="width:100%">${esc(x.action)}</textarea></div><div class="grid"><label>対応状況<br><select id="status" style="width:100%;margin-top:6px">${opts(['要確認','確認中','対応予定','次回訪問','支援接続済','対応不要'],x.status)}</select></label><label>対応期限<br><input id="due" type="date" value="${x.due}" style="width:100%;margin-top:6px"></label></div><div class="row" style="margin-top:18px"><button class="primary" onclick="updateCase()">変更を保存</button><button onclick="go('actions')">フォロー管理へ →</button></div><p class="small muted">判断は職員が行います。「未利用」だけを理由に支援不足とは判定しません。</p></div>`}function casesPage(){return head('生活課題 × 支援利用状況','会話から把握した課題と既存支援の状況を照合し、次の確認事項を管理します。')+`<div class="layout"><div class="panel"><h3>ケースを選択</h3>${cases.map(x=>`<div class="list-item ${x.id===selected?'sel':''}" onclick="selected='${x.id}';render()"><b>${esc(x.name)}　${badge(x.status)}</b><small>${x.area}・${x.issue}・${x.id}</small></div>`).join('')}</div>${detail()}</div>`}function updateCase(){let x=cases.find(x=>x.id===selected);Object.assign(x,{support:$('#support').value,wish:$('#wish').value,status:$('#status').value,action:$('#next').value,due:$('#due').value});save();render();alert('ケースの変更を保存しました（このブラウザ内のみ）。')}function actionsPage(){let list=cases.filter(x=>filterStatus==='すべて'||x.status===filterStatus);return head('訪問後フォロー管理','相談を聞いて終わりにせず、担当者・期限・対応結果を追跡します。',`<button onclick="csv(cases)">CSV出力</button>`)+`<div class="panel"><div class="toolbar"><label>状況 <select onchange="filterStatus=this.value;render()">${opts(['すべて','要確認','確認中','対応予定','次回訪問','支援接続済','対応不要'],filterStatus)}</select></label><button onclick="filterStatus='すべて';render()">絞り込み解除</button></div><div style="overflow-x:auto"><table><thead><tr><th>ケース</th><th>地域</th><th>困りごと</th><th>次の対応</th><th>担当</th><th>期限</th><th>状況</th><th>操作</th></tr></thead><tbody>${list.map(x=>`<tr><td>${esc(x.name)}<br><span class="small">${x.id}</span></td><td>${x.area}</td><td>${x.issue}</td><td>${esc(x.action)}</td><td>${x.staff}</td><td>${x.due||'—'}</td><td>${badge(x.status)}</td><td><button onclick="selected='${x.id}';go('cases')">編集</button> <button class="green" onclick="complete('${x.id}')" ${x.status==='支援接続済'||x.status==='対応不要'?'disabled':''}>支援接続</button></td></tr>`).join('')}</tbody></table></div></div>`}function complete(id){let x=cases.find(x=>x.id===id);if(!confirm(`${x.name}さんについて「支援接続済」に変更しますか？\n※デモ操作です。`))return;x.status='支援接続済';save();render()}function dashboard(){let a=cases.filter(x=>(filterArea==='すべて'||x.area===filterArea)&&(filterIssue==='すべて'||x.issue===filterIssue));let regions=['A地区','B地区','C地区','D地区'].map(area=>{let b=a.filter(x=>x.area===area);return {area,total:b.length,done:b.filter(x=>x.status==='支援接続済').length,open:b.filter(x=>!['支援接続済','対応不要'].includes(x.status)).length}});let issues=[...new Set(cases.map(x=>x.issue))].map(issue=>({issue,n:a.filter(x=>x.issue===issue).length}));return head('Treasure Data 連携｜地域支援ギャップ分析','会話で見つかった生活課題 × 支援利用状況 × 対応状況を地域別に可視化（サンプル集計）。',`<button onclick="csv(a)">集計対象をCSV出力</button>`)+`<div class="toolbar"><label>地域 <select onchange="filterArea=this.value;render()">${opts(['すべて','A地区','B地区','C地区','D地区'],filterArea)}</select></label><label>生活課題 <select onchange="filterIssue=this.value;render()">${opts(['すべて',...new Set(cases.map(x=>x.issue))],filterIssue)}</select></label><button onclick="filterArea='すべて';filterIssue='すべて';render()">リセット</button></div>`+tiles(a)+`<div class="grid"><div class="panel"><h3>地域別｜未確認・未対応候補の比率</h3>${regions.map(r=>`<div class="chartrow"><b>${r.area}</b><div class="bar"><div style="width:${r.total?Math.round(r.open/r.total*100):0}%"></div></div><span>${r.total?Math.round(r.open/r.total*100):0}%</span></div>`).join('')}<div class="notice">比率＝（支援接続済・対応不要を除くケース）÷ 対象ケース。支援不足の確定率ではありません。</div></div><div class="panel"><h3>生活課題別｜訪問で把握した件数</h3>${issues.map(i=>`<div class="chartrow"><b>${esc(i.issue)}</b><div class="bar"><div style="width:${a.length?Math.round(i.n/a.length*100):0}%;background:#538de9"></div></div><span>${i.n}件</span></div>`).join('')}<p class="small muted">ケース編集・支援接続の変更は、この集計に即時反映されます。</p></div></div><div class="panel" style="margin-top:17px"><h3>地域別・支援状況（デモ集計）</h3><table><thead><tr><th>地域</th><th>訪問ケース数</th><th>支援接続済</th><th>未確認・未対応候補</th><th>未確認・未対応率</th></tr></thead><tbody>${regions.map(r=>`<tr><td>${r.area}</td><td>${r.total}</td><td>${r.done}</td><td>${r.open}</td><td>${r.total?Math.round(r.open/r.total*100):0}%</td></tr>`).join('')}</tbody></table></div>`}function guide(){return head('操作ガイドと導入時の注意','会議でそのままデモ操作できるようにしています。',`<button class="danger" onclick="reset()">テストデータを初期化</button>`)+`<div class="panel"><h3>おすすめのデモ手順（約3分）</h3><div class="steps"><div class="step"><b>1. 訪問記録・TAV</b><br>鈴木花子さんを選択し「会話抽出を再現」をクリック。</div><div class="step"><b>2. 支援ギャップ確認</b><br>本人の希望・支援利用状況を確認し、対応状況を変更して保存。</div><div class="step"><b>3. TD地域分析</b><br>地域別の未対応率の変化を確認。地域・生活課題で絞り込み。</div></div><h3 style="margin-top:24px">現実のシステムとの違い</h3><p>このページは静的HTML＋JavaScriptで動く体験用モックです。会話抽出は事前登録した例文の表示、支援利用状況は架空データ、TD分析はブラウザ内での計算です。録音・音声送信・認証・行政基幹システム連携・Treasure Data API接続は実装していません。</p><div class="notice">実運用では、本人同意・収録目的の説明、機微情報の最小化、職員による確認、アクセス制御、保管期間、自治体の個人情報保護ルールへの適合が必要です。地域分析は原則として集計・匿名化し、少数件数の再識別にも注意します。</div></div>`}function csv(a){let h=['ケースID','氏名（架空）','地域','生活課題','支援利用','本人意向','対応状況','次の対応','期限'];let rows=a.map(x=>[x.id,x.name,x.area,x.issue,x.support,x.wish,x.status,x.action,x.due]);let s='\ufeff'+[h,...rows].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));let l=document.createElement('a');l.href=url;l.download='welfare_demo_cases.csv';l.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function reset(){if(confirm('編集したテストデータを初期状態に戻しますか？')){cases=structuredClone(BASE);selected=cases[0].id;save();render()}}function render(){let m={overview,visits,cases:casesPage,actions:actionsPage,dashboard,guide};$('#content').innerHTML=m[page]()+`<div class="footer">TAV × Treasure Data 福祉訪問支援デモ ｜ 全データは架空 ｜ 編集内容はこのブラウザのローカルストレージにのみ保存されます。</div>`}render();
</script></body></html>
